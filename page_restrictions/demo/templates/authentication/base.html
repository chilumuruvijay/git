<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Authentication App{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; line-height: 1.6; }
        .container { width: 80%; margin: 0 auto; padding: 20px; }
        nav { background: #333; color: white; padding: 10px 0; }
        nav .container { display: flex; justify-content: space-between; align-items: center; }
        nav ul { list-style: none; display: flex; }
        nav ul li { margin-left: 20px; }
        nav a { color: white; text-decoration: none; }
        .messages { padding: 10px; margin-bottom: 20px; }
        .messages .success { background: #d4edda; color: #155724; padding: 10px; border-radius: 5px; }
        .messages .error { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 5px; }
        form { max-width: 500px; margin: 0 auto; }
        form div { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #333; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <h1>Auth App</h1>
            <ul>
                <li><a href="{% url 'home' %}">Home</a></li>
                {% if user.is_authenticated %}
                    <li><a href="{% url 'dashboard' %}">Dashboard</a></li>
                    <li><a href="{% url 'logout' %}">Logout</a></li>
                {% else %}
                    <li><a href="{% url 'login' %}">Login</a></li>
                    <li><a href="{% url 'register' %}">Register</a></li>
                {% endif %}
            </ul>
        </div>
    </nav>

    <div class="container">
        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}

        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
