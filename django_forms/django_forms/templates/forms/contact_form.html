<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Contact Form</title> 
</head>
<body> 
    <h2>Contact Us</h2> 
    <form method="POST"> 
        {% csrf_token %} 
        {{ form.as_p }}  <!-- Render form fields as paragraphs --> 
        <button type="submit">Submit</button> 
    </form> 
    {% if form.errors %} 
        <ul> 
            {% for field in form %} 
                {% for error in field.errors %} 
                    <li>{{ error }}</li> 
                {% endfor %} 
            {% endfor %} 
        </ul> 
    {% endif %} 
</body> 
</html>
