<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Bootstrap Sample Page</title> 
    <!-- Bootstrap CSS --> 
    <link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
rel="stylesheet"> 
</head> 
<body> 
    <div class="container mt-5"> 
        <h1 class="text-center">Welcome to the Bootstrap Sample Page</h1> 
        <p class="lead text-center">This is a simple page styled with 
Bootstrap!</p> 
<div class="row mt-4"> 
    <div class="col-md-4"> 
        <div class="card"> 
            <div class="card-body"> 
                <h5 class="card-title">Card 1</h5> 
                <p class="card-text">This is a simple card description.</p> 
                <a href="#" class="btn btn-primary">Go Somewhere</a> 
            </div> 
        </div> 
    </div> 
    <div class="col-md-4"> 
        <div class="card"> 
            <div class="card-body"> 
                <h5 class="card-title">Card 2</h5> 
                <p class="card-text">This is another card description.</p> 
                <a href="#" class="btn btn-secondary">Learn More</a> 
            </div> 
        </div> 
    </div> 
    <div class="col-md-4"> 
        <div class="card"> 
            <div class="card-body"> 
                <h5 class="card-title">Card 3</h5> 
                <p class="card-text">This is a third card description.</p> 
                <a href="#" class="btn btn-success">Explore</a> 
            </div> 
        </div> 
    </div> 
</div>
</div> 
<!-- Bootstrap Bundle with Popper --> 
<script 
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.j
s"></script> 
</body> 
</html>
